<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.asuslinuxcontrol.Daemon"/>
  </policy>

  <!-- Allow users to call daemon methods (polkit handles authorization for writes) -->
  <!-- Other hardware control (perf mode, TDP, battery) goes through asusd -->
  <policy context="default">
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetTempLimit"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="SetTempLimit"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetProfileTempLimit"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="SetProfileTempLimit"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetCpuBoostStatus"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="SetCpuBoostMode"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="StartFanEngine"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="StopFanEngine"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="UpdateFanEngineCurve"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetFanEngineRunning"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetPackageBackend"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="CheckForUpdates"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="StartUpdate"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetUpdateStatus"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="CancelUpdate"/>
    <allow send_destination="com.asuslinuxcontrol.Daemon"
           send_interface="com.asuslinuxcontrol.Daemon"
           send_member="GetRogHotkeyStatus"/>

    <!-- Allow clients to subscribe to read-only ROG key press notifications. -->
    <allow receive_sender="com.asuslinuxcontrol.Daemon"
           receive_interface="com.asuslinuxcontrol.Daemon"
           receive_member="RogKeyPressed"/>
    
    <!-- Allow receiving replies -->
    <allow receive_sender="com.asuslinuxcontrol.Daemon"/>
  </policy>
</busconfig>
