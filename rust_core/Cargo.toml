[package]
name = "asus_linux_control_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# FFI Bridge
flutter_rust_bridge = "=2.12.0"

# Hardware monitoring
libmedium = "0.5"

# NVIDIA GPU support
nvml-wrapper = "0.10"

# Battery/Power management
upower_dbus = "0.3"
zbus = "4.0"

# USB HID (RGB, Anime Matrix)
hidapi = "2.5"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# XDG config directories
dirs = "5"

[dev-dependencies]
