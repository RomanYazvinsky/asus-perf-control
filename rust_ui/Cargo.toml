[package]
name = "asus-linux-control"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
description = "ASUS Linux Control desktop application"
license = "MIT"

[[bin]]
name = "asus-linux-control"
path = "src/main.rs"

[lib]
name = "asus_linux_control_ui"
path = "src/lib.rs"

[dependencies]
asus_linux_control_core = { path = "../rust_core" }

eframe = "0.36"
egui = "0.36"

zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
async-trait = "0.1"
anyhow = "1.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
