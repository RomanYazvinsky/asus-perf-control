[package]
name = "asus-control-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "asus-control-daemon"
path = "src/main.rs"

[dependencies]
# D-Bus
zbus = "4.0"
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# File I/O
nix = { version = "0.27", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size
